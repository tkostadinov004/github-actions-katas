name: Main workflow
on: push
jobs:
  Linting:
    runs-on: ubuntu-latest
    steps:
      - name: Clone down repository
        uses: actions/checkout@v4
      - name: Lint code
        uses: super-linter/super-linter@v9.0.0
  Build:
    runs-on: ubuntu-latest
    container: gradle:6-jdk11
    needs: Linting
    steps:
      - name: Clone down repository
        uses: actions/checkout@v4       
      - name: Build application
        run: ci/build-app.sh
      - name: Test
        run: ci/unit-test-app.sh
